<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Translator</title>
</head>
<body>
    <div id="container" class="container"></div>
        <main class="page-shell">
            <header class="site-header">
                <a class="brand" href="index.html">
                    <span></span>
                    <span class="brand-mark">  ·− </span>
                    <span>MORSE-CODE<span class="brand-slash">/</span>TRANSLATOR</span>
                </a>
            </header>

            <section class="hero">
               <h1 id="page-title">Give your words <br> <em>a signal.</em> </h1>
            </section>

            <section class="translator-grid">
                <!-- Input Box -->
                <div class="panel input-panel">
                    <div class="panel-heading">
                        <label for="eng"> Your message </label>
                        <span id="char-count"> 0 / 500 </span>
                    </div>
                    <textarea id="eng" maxlength="500" placeholder="Type something worth decoding..." spellcheck="true"></textarea>
                    <div class="panel-footer">
                        <span class="input-hint">Letters, numbers &amp; common punctuation</span>
                        <button type="button" class="clear-button" id="clear-btn">Clear</button>
                    </div>
                </div>
                
                <!-- Translate button -->
                <div class="action-column">
                    <button type="button" class="trans-button" id="trans"> Translate </button>
                </div>
                
                
                <!-- Output Box -->
                <div class="panel output-panel">
                    <div class="panel-heading">
                        <label for="morse-output">Morse output</label>
                    </div>
                    <textarea id="morse-output" readonly placeholder="Your translation will appear here..."></textarea>
                    <div class="panel-footer output-footer">
                        <span id="output-status">Waiting for input</span>
                        <button type="button" class="copy-button" id="copy-btn"> Copy </button>
                    </div>
                </div>   
            </section>

            <footer class="page-footer">
                <span>SEPARATE LETTERS WITH SPACES <b>·</b> WORDS WITH /</span>
            </footer>
        </main>
        
</body>

<!-- 3D background -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.net.min.js"></script>
<script>
VANTA.NET({
el: "#container",
mouseControls: false,
touchControls: true,
gyroControls: false,
minHeight: 200.00,
minWidth: 200.00,
scale: 1.00,
scaleMobile: 1.00,
color: 0x8757,
points: 13.00,
maxDistance: 24.00,
spacing: 18.00
})
</script>

</html>
