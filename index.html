<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Translator</title>
</head>
<body>
    <div id="container" class="container"></div>
        <main>
            <h1>Translate to Morse Code</h1>

            <section class="translator-grid">
                <!-- Input Box -->
                <div class="input">
                    <textarea id="eng" maxlength="500" placeholder="Type something worth decoding..."></textarea>
                </div>
                
                <!-- Translate button -->
                <button type="button" class="trans-button" id="trans"> Translate </button>
                <br><br>
                
                <!-- Output Box -->
                <div class="output">
                    <textarea id="morse-output" readonly placeholder="Your translation will appear here..."></textarea>
                </div>   
            </section>
        </main>
        
</body>

<!-- 3D background -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.net.min.js"></script>
<script>
VANTA.NET({
el: "#container",
mouseControls: false,
touchControls: true,
gyroControls: false,
minHeight: 200.00,
minWidth: 200.00,
scale: 1.00,
scaleMobile: 1.00,
color: 0x8757,
points: 13.00,
maxDistance: 24.00,
spacing: 18.00
})
</script>

</html>
