<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Translator</title>
</head>
<body>
    <h1>Translate to Morse Code</h1>

    <section class="translator-grid">
        <!-- Input Box -->
        <div class="input">
            <textarea id="eng"></textarea>
        </div>
        
        <!-- Translate button -->
        <button type="button" class="button" id="trans"> Translate </button>
        <br><br>
        
        <!-- Output Box -->
        <div class="output">
            <textarea id="morse-output" readonly placeholder="Your translation will appear here..."></textarea>
        </div>   
        
    </section>
    
</body>
</html>
